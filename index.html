  <style>
    :root {
      color-scheme: dark;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --blue: #0000ff;
      --blue-l: #00ff00;
      --accent: #0000ff;
      --green-soft: #ffffff;
      --fg: #f5f5f7;
      --fg2: rgba(245, 245, 247, .58);
      --fg3: rgba(245, 245, 247, .28);
      --bg: #000000;
      --sep: rgba(255, 255, 255, .055);
      --hover: rgba(255, 255, 255, .055);
      --liquid: rgba(246, 246, 250, .018);
      --liquid2: rgba(0, 40, 218, .033);
      --liquid3: rgba(255, 255, 255, .015);
      --liquid-border: rgba(0, 0, 0, .068);
      --liquid-border-strong: rgba(232, 232, 246, .118);
      --liquid-inset: rgba(255, 255, 255, .105);
      --liquid-edge: rgba(255, 255, 255, .08);
      --liquid-shadow: rgba(0, 0, 10, .34);
      --input-glow: rgba(11, 0, 246, .118);
      --send-border: rgba(0, 9, 205, .22);
      --send-inset: rgba(255, 255, 255, .18);
      --send-shadow: rgba(80, 90, 255, .18);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      background: var(--bg);
    }
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--fg);
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      touch-action: pan-y;
    }
    input, textarea, [contenteditable="true"], .bubble, .ai-bubble, .bubble *, .ai-bubble *, pre, code, .cb, .cb * {
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default;
    }
    button, a, label, summary, svg, img {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }
    button, input, textarea {
      font: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    button {
      font-family: inherit;
    }
    textarea {
      border-radius: 0;
    }
    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #000000;
    }
    #bg:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #4b6cf7 0%, #000000 50%, #0009cd 100%);
      opacity: 0.15;
      filter: blur(80px);
    }
    #bg:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.98));
    }
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    .lg {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--liquid2), var(--liquid3) 48%, var(--liquid));
      border: .45px solid var(--liquid-border);
      box-shadow: 0 .7px 0 var(--liquid-inset) inset, 0 -.45px 0 rgba(0, 0, 0, .14) inset, 0 0 0 .35px rgba(80, 90, 255, .07), 0 14px 42px var(--liquid-shadow);
      backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
      -webkit-backdrop-filter: blur(36px) saturate(190%) contrast(1.08) brightness(1.04);
      isolation: isolate;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    .lg:before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(150deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .022) 34%, rgba(80, 90, 255, .035) 58%, rgba(11, 0, 246, .025));
      mix-blend-mode: screen;
    }
    .lg:after {
      content: "";
      position: absolute;
      inset: .5px;
      border-radius: inherit;
      pointer-events: none;
      border: .35px solid rgba(255, 255, 255, .035);
      box-shadow: 0 0 18px rgba(80, 90, 255, .04) inset;
    }
    .lg>* {
      position: relative;
      z-index: 1;
    }
    #sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 100%;
      z-index: 310;
      padding-top: var(--sat);
      padding-left: var(--sal);
      padding-right: var(--sar);
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform .42s cubic-bezier(.32, .72, 0, 1.18);
      will-change: transform;
      background: rgba(2, 8, 5, .18);
      backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
      -webkit-backdrop-filter: blur(48px) saturate(185%) contrast(1.05);
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #sidebar.dragging {
      transition: none;
    }
    #sidebar[aria-hidden="true"] {
      pointer-events: none;
    }
    #sidebar[aria-hidden="false"] {
      pointer-events: auto;
    }
    .sb-backdrop {
      position: fixed;
      inset: 0;
      z-index: 309;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity;
    }
    .sb-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sb-hdr {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: .5px solid var(--sep);
      gap: 8px;
      flex-shrink: 0;
    }
    .sb-title {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sb-close, .hcard-del, .img-rm {
      border: none;
      cursor: pointer;
    }
    .sb-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg2);
      background: transparent;
    }
    .sb-close:active {
      transform: scale(.88);
      opacity: .7;
    }
    .sb-close svg {
      width: 17px;
      height: 17px;
    }
    #sb-search-bar {
      height: 0;
      visibility: hidden;
      overflow: hidden;
      transition: height .32s cubic-bezier(.34, 1.28, .64, 1), visibility .32s;
      flex-shrink: 0;
    }
    #sb-search-bar.open {
      height: 54px;
      visibility: visible;
    }
    .sb-si {
      height: 38px;
      margin: 8px 14px 6px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }
    .sb-si svg {
      width: 16px;
      height: 16px;
      fill: var(--fg3);
      flex-shrink: 0;
    }
    #sb-q {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--fg);
      min-width: 0;
    }
    #sb-q::placeholder {
      color: var(--fg3);
    }
    #sb-q-cancel {
      background: transparent;
      border: none;
      color: var(--green-soft);
      font-size: 15px;
      cursor: pointer;
      width: 0;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      white-space: nowrap;
      transition: width .2s, opacity .2s;
    }
    #sb-search-bar.open #sb-q-cancel {
      width: 52px;
      opacity: 1;
      pointer-events: auto;
    }
    .sb-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding: 12px;
    }
    .sb-body::-webkit-scrollbar, #scroll-area::-webkit-scrollbar, .img-strip::-webkit-scrollbar, .src-chips::-webkit-scrollbar, #ta::-webkit-scrollbar {
      display: none;
    }
    .sb-pull-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 0 0;
      font-size: 11px;
      color: var(--fg3);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .sb-pull-hint svg {
      width: 12px;
      height: 12px;
      fill: var(--fg3);
    }
    #sidebar.pull-hinting .sb-pull-hint {
      opacity: 1;
    }
    .sb-new {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--green-soft);
      text-align: left;
    }
    .sb-new svg {
      width: 16px;
      height: 16px;
      fill: var(--green-soft);
      flex-shrink: 0;
    }
    .sb-new:active, .hcard:active {
      transform: scale(.97);
    }
    .sb-sec {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg3);
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 2px 3px 8px;
      margin-top: 4px;
    }
    .hcard {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 6px;
      border: .5px solid transparent;
      background: transparent;
      transition: transform .22s cubic-bezier(.2, 1, .3, 1), background .14s, border-color .14s;
    }
    @media (hover: hover) and (pointer: fine) {
      .hcard:hover {
        background: var(--hover);
        backdrop-filter: blur(22px) saturate(170%);
        -webkit-backdrop-filter: blur(22px) saturate(170%);
        border-color: var(--liquid-border-strong);
      }
    }
    .hcard.active {
      background: linear-gradient(135deg, rgba(11, 0, 246, .075), rgba(80, 90, 255, .07));
      border-color: rgba(80, 90, 255, .25);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 0 0 .35px rgba(80, 90, 255, .06), 0 8px 28px rgba(80, 90, 255, .05);
    }
    .hcard-body {
      flex: 1;
      min-width: 0;
    }
    .hcard-pre {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.15px;
    }
    .hcard-pre mark {
      background: rgba(80, 90, 255, .18);
      color: var(--green-soft);
      border-radius: 3px;
      padding: 0 1px;
    }
    .hcard.active .hcard-pre {
      color: var(--green-soft);
    }
    .hcard-meta {
      font-size: 11px;
      color: var(--fg3);
      margin-top: 2px;
    }
    .hcard-del {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--fg3);
      opacity: 0;
      pointer-events: none;
    }
    .hcard-del svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .hcard:hover .hcard-del, .hcard:focus-within .hcard-del {
      opacity: 1;
      pointer-events: auto;
    }
    @media (pointer: coarse) {
      .hcard-del {
        opacity: 1;
        pointer-events: auto;
      }
    }
    .hcard-del:active {
      background: rgba(255, 59, 48, .15);
      color: rgba(255, 59, 48, .85);
      transform: scale(.85);
    }
    .hcard-pin {
      display: none;
      width: 11px;
      height: 11px;
      margin-right: 3px;
      vertical-align: middle;
    }
    .hcard.pinned .hcard-pin {
      display: inline-block;
    }
    .hcard-pin svg {
      fill: var(--green-soft);
    }
    .hcard-pre[contenteditable="true"] {
      outline: none;
      background: rgba(0, 255, 157, .1);
      border-radius: 7px;
      padding: 2px 5px;
      margin: -2px -5px;
      white-space: normal;
    }
    .h-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 48px 16px;
      text-align: center;
    }
    .h-empty svg {
      width: 28px;
      height: 28px;
      fill: var(--fg3);
      opacity: .45;
    }
    .h-empty p {
      font-size: 13px;
      color: var(--fg3);
      line-height: 1.5;
    }
    #content {
      flex: 1;
      overflow: hidden;
      position: relative;
      z-index: 1;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #scroll-area {
      flex: 1;
      position: relative;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      scrollbar-width: none;
      padding: 12px 0 20px;
      padding-top: calc(12px + var(--sat));
      scroll-padding-top: 20px;
      scroll-padding-bottom: 20px;
      min-height: 0;
    }
    #msg-list {
      display: flex;
      flex-direction: column;
      padding: 0 calc(14px + var(--sar)) 0 calc(14px + var(--sal));
      min-height: 100%;
    }
    .msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 8px;
    }
    .msg-group.u {
      align-items: flex-end;
    }
    .msg-group.a {
      align-items: flex-start;
    }
    .bubble, .ai-bubble {
      max-width: 100%;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -.18px;
      word-break: break-word;
      overflow-wrap: anywhere;
      position: relative;
    }
    .u .bubble {
      color: #f7fffb;
      max-width: 85%;
      padding: 9px 14px;
      border-radius: 20px;
      background: linear-gradient(138deg, rgba(0, 9, 205, .78) 0%, rgba(80, 90, 255, .72) 48%, rgba(95, 106, 247, .66) 100%);
      border: .45px solid rgba(160, 170, 255, .32);
      box-shadow: 0 5px 26px rgba(80, 90, 255, .15), 0 3px 18px rgba(11, 0, 246, .08), 0 1.2px 0 rgba(255, 255, 255, .22) inset, 0 -.7px 0 rgba(0, 0, 0, .16) inset;
      backdrop-filter: blur(24px) saturate(175%);
      -webkit-backdrop-filter: blur(24px) saturate(175%);
    }
    .ai-bubble {
      padding: 4px 0;
      background: transparent;
      color: var(--fg);
      border: none;
      box-shadow: none;
    }
    .md p {
      margin: 0 0 8px;
    }
    .md p:last-child {
      margin-bottom: 0;
    }
    .md h1, .md h2, .md h3 {
      margin: 12px 0 7px;
      line-height: 1.3;
      font-weight: 600;
    }
    .md h1 {
      font-size: 19px;
    }
    .md h2 {
      font-size: 17px;
    }
    .md h3 {
      font-size: 15.5px;
    }
    .md ul, .md ol {
      margin: 6px 0 8px;
      padding-left: 22px;
    }
    .md li {
      margin: 3px 0;
    }
    .md a {
      color: var(--green-soft);
      text-decoration: none;
    }
    .md hr {
      border: none;
      border-top: 1px solid var(--sep);
      margin: 12px 0;
    }
    .md .ic {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: .88em;
      background: rgba(255, 255, 255, .045);
      padding: 1.5px 5px;
      border-radius: 6px;
      border: .5px solid var(--liquid-border);
    }
    .img-in-msg {
      border-radius: 16px;
      overflow: hidden;
      max-width: 220px;
      max-height: 185px;
      object-fit: cover;
      display: block;
      margin-bottom: 6px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .2);
    }
    .err-bbl {
      display: inline-block;
      max-width: 90%;
      margin: 4px 0;
      padding: 9px 13px;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--fg);
      background: rgba(0, 255, 157, .095);
      border: .5px solid rgba(0, 255, 157, .2);
      border-radius: 15px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .rcn-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 5px 14px;
      padding: 8px 12px;
      background: rgba(0, 40, 218, .08);
      border: .5px solid rgba(0, 40, 218, .16);
      border-radius: 13px;
      font-size: 12px;
      color: rgba(80, 90, 255, .9);
    }
    .rcn-bar svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      animation: spin 1.1s linear infinite;
    }
    .agent-workflow {
      margin: 4px 0 10px;
      min-width: min(100%, 520px);
    }
    .agent-workflow .srch-bar {
      margin: 0;
    }
    .agent-chain {
      margin: 7px 2px 0 14px;
      padding: 2px 0 1px 13px;
      border-left: 1px solid var(--sep);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .agent-chain-row {
      position: relative;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 7px;
      color: var(--fg2);
      min-width: 0;
    }
    .agent-chain-dot {
      width: 8px;

void main(){ vec2 p=(vUv-0.5)*vec2(uRes.x/uRes.y,1.0); float t=uTime*0.045; vec3 c=vec3(0.02,0.024,0.05); for(int i=0;i<4;i++){ float f=float(i); vec2 d=vec2(sin(t*0.2+f*1.7),cos(t*0.17+f*1.3))*0.42; float m=smoothstep(1.0,0.0,length(p-d)); c+=pal(f*0.17+t*0.03)*m*0.35; } c*=0.9+0.18*pow(vUv.x*(1.0-vUv.x)*vUv.y*(1.0-vUv.y)*16.0,0.18); o=vec4(c,1.0); }`;
      const BLUR = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel; uniform vec2 uDir; uniform float uWeights[201]; uniform int uRadius;
void main(){ vec3 s=texture(uTex,vUv).rgb*uWeights[0]; for(int i=1;i<201;i++){ if(i>uRadius) break; vec2 o=uTexel*uDir*float(i); s+=texture(uTex,vUv+o).rgb*uWeights[i]; s+=texture(uTex,vUv-o).rgb*uWeights[i]; } o=vec4(s,1.0); }`;
      const MAIN = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uBg; uniform sampler2D uBlur; uniform vec2 uRes; uniform float uDpr; uniform float uTime;
uniform int uShapeCount; uniform vec4 uRects[48]; uniform float uRadii[48];
uniform float uThickness; uniform float uRefFactor; uniform float uDispersion; uniform float uFresnelRange; uniform float uFresnelHardness; uniform float uFresnelFactor; uniform float uGlareRange; uniform float uGlareHardness; uniform float uGlareFactor; uniform float uGlareConvergence; uniform float uGlareOppositeFactor; uniform float uGlareAngle; uniform vec4 uTint; uniform int uStep;
float sdRoundRect(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+vec2(r); return min(max(q.x,q.y),0.0)+length(max(q,0.0))-r; }
float sdfScene(vec2 px, out int hit){ float d=1e9; hit=-1; for(int i=0;i<48;i++){ if(i>=uShapeCount) break; vec4 r=uRects[i]; vec2 c=r.xy+r.zw*0.5; vec2 h=max(r.zw*0.5-1.0, vec2(1.0)); float sd=sdRoundRect(px-c,h,max(1.0,uRadii[i])); if(sd<d){ d=sd; hit=i; } } return d; }
vec2 nrm(vec2 px){ int h; float e=max(1.0,uDpr); float dx=sdfScene(px+vec2(e,0.),h)-sdfScene(px-vec2(e,0.),h); float dy=sdfScene(px+vec2(0.,e),h)-sdfScene(px-vec2(0.,e),h); return normalize(vec2(dx,dy)+1e-6); }
void main(){ vec2 px=vUv*uRes; vec3 bg=texture(uBg,vUv).rgb; vec3 blur=texture(uBlur,vUv).rgb; int hit; float sdf=sdfScene(px,hit); if(hit<0){ o=vec4(bg,1.0); return; } vec2 n=nrm(px); float inside=step(sdf,0.0); float edgeBand=1.0-smoothstep(0.0,max(1.0,uThickness),abs(sdf)); float edge=inside*edgeBand; float incidence=clamp(1.0-abs(dot(n, vec2(0.0,-1.0))),0.0,1.0); float ref=edge*incidence*uRefFactor; vec2 off=(n*ref*14.0)/uRes; float disp=uDispersion/max(uRes.x,uRes.y); vec3 refr; refr.r=texture(uBlur,vUv+off*0.98+n*disp*0.98).r; refr.g=texture(uBlur,vUv+off*1.00).g; refr.b=texture(uBlur,vUv+off*1.02-n*disp*1.02).b; vec3 glass=mix(blur,refr,0.92); float fresBand=1.0-smoothstep(0.0,max(1.0,uFresnelRange),abs(sdf)); float fres=pow(clamp(fresBand,0.0,1.0),max(0.001,uFresnelHardness*0.15))*(uFresnelFactor/20.0); vec3 fresCol=mix(vec3(1.0),uTint.rgb,uTint.a); float ang=radians(uGlareAngle); vec2 gd=normalize(vec2(cos(ang),sin(ang))); float ndg=max(dot(n,gd),0.0); float glare=pow(edge*smoothstep(0.0,1.0,ndg),max(0.001,uGlareHardness*0.15))*(uGlareFactor/90.0); glare*=mix(uGlareOppositeFactor/100.0,1.0,ndg); glare*=smoothstep(0.0,1.0,uGlareConvergence/100.0+0.25); vec3 comp=mix(bg, mix(glass, fresCol, clamp(fres*0.5,0.0,0.9)) + vec3(1.0)*glare*0.45, inside); if(uStep==1){o=vec4(vec3(clamp(0.5-sdf/80.0,0.0,1.0)),1.0);return;} if(uStep==2){o=vec4(n*0.5+0.5,0.5,1.0);return;} if(uStep==3){o=vec4(vec3(edge),1.0);return;} if(uStep==4){o=vec4(blur,1.0);return;} if(uStep==5){o=vec4(refr,1.0);return;} if(uStep==6){o=vec4(vec3(fres),1.0);return;} if(uStep==7){o=vec4(vec3(glare),1.0);return;} if(uStep==8){o=vec4(vec3(inside),1.0);return;} if(uStep==9){o=vec4(bg,1.0);return;} o=vec4(comp,1.0); }`;
      const sh = (t, s) => {
        const r = gl.createShader(t);
        gl.shaderSource(r, s);
        gl.compileShader(r);
        if (!gl.getShaderParameter(r, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(r));
        return r;
      };
      const prog = (v, f) => {
        const p = gl.createProgram();
        gl.attachShader(p, sh(gl.VERTEX_SHADER, v));
        gl.attachShader(p, sh(gl.FRAGMENT_SHADER, f));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        return p;
      };
      const tex = (w, h) => {
        const t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
        return t;
      };
      const fbo = (w, h) => {
        const texture = tex(w, h);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        return {
          fb,
          texture,
          w,
          h
        };
      };
      const kernel = (radius) => {
        const sigma = Math.max(radius / 3, 0.001),
          a = new Float32Array(KERNEL_MAX);
        let sum = 0;
        for (let i = 0; i <= radius; i++) {
          const w = Math.exp(-(i * i) / (2 * sigma * sigma));
          a[i] = w;
          sum += i === 0 ? w : w * 2;
        }
        for (let i = 0; i <= radius; i++) a[i] /= sum;
        return a;
      };
      const uloc = (p, n) => {
        const o = {};
        n.forEach(x => o[x] = gl.getUniformLocation(p, x));
        return o;
      };
      class MultiPassRenderer {
        constructor() {
          this.bgProg = prog(VS, BG);
          this.blurProg = prog(VS, BLUR);
          this.mainProg = prog(VS, MAIN);
          this.bgLoc = uloc(this.bgProg, ['uRes', 'uTime']);
          this.blurLoc = uloc(this.blurProg, ['uTex', 'uTexel', 'uDir', 'uWeights', 'uRadius']);
          this.mainLoc = uloc(this.mainProg, ['uBg', 'uBlur', 'uRes', 'uDpr', 'uTime', 'uShapeCount', 'uRects', 'uRadii', 'uThickness', 'uRefFactor', 'uDispersion', 'uFresnelRange', 'uFresnelHardness', 'uFresnelFactor', 'uGlareRange', 'uGlareHardness', 'uGlareFactor', 'uGlareConvergence', 'uGlareOppositeFactor', 'uGlareAngle', 'uTint', 'uStep']);
          this.rects = new Float32Array(MAX_SHAPES * 4);
          this.radii = new Float32Array(MAX_SHAPES);
          this.radius = Math.max(1, Math.min(200, PROFILE.blurRadius | 0));
          this.weights = kernel(this.radius);
          this.resize();
        }
        resize() {
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          this.dpr = dpr;
          this.w = Math.max(1, Math.round(innerWidth * dpr));
          this.h = Math.max(1, Math.round(innerHeight * dpr));
          canvas.width = this.w;
          canvas.height = this.h;
          canvas.style.width = innerWidth + 'px';
          canvas.style.height = innerHeight + 'px';
          gl.viewport(0, 0, this.w, this.h);
          if (!this.bg) {
            this.bg = fbo(this.w, this.h);
            this.vb = fbo(this.w, this.h);
            this.hb = fbo(this.w, this.h);
          } else {
            [this.bg, this.vb, this.hb].forEach(p => {
              gl.bindTexture(gl.TEXTURE_2D, p.texture);
              gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, this.w, this.h, 0, gl.RGBA, gl.HALF_FLOAT, null);
              p.w = this.w;
              p.h = this.h;
            });
          }
        }
        collect() {
          const sels = ['.glass-host', '.lg', '#sidebar', '.ibox', '.ctx-menu', '.as-group', '.as-cancel', '.cb', '.toast', '#stb', '.src-chip', '.srch-bar', '.file-chip', '.sb-si', '.sb-new', '.u .bubble', '.hcard.active', '.rcn-bar'];
          const allEls = document.querySelectorAll(sels.join(','));
          const seen = new Set();
          const els = [];
          for (const e of allEls) {
            if (!seen.has(e) && e.offsetParent !== null) {
              seen.add(e);
              els.push(e);
            }
          }
          let n = 0;
          if (!this._radCache) this._radCache = new WeakMap();
          const radCache = this._radCache;
          for (const el of els) {
            if (n >= MAX_SHAPES) break;
            const r = el.getBoundingClientRect();
            if (r.width < 8 || r.height < 8) continue;
            this.rects[n * 4 + 0] = r.left * this.dpr;
            this.rects[n * 4 + 1] = r.top * this.dpr;
            this.rects[n * 4 + 2] = r.width * this.dpr;
            this.rects[n * 4 + 3] = r.height * this.dpr;
            let rad = radCache.get(el);
            if (rad === undefined) {
              const cs = getComputedStyle(el);
              const pr = parseFloat(cs.borderTopLeftRadius || '20');
              rad = Number.isFinite(pr) ? pr : 20;
              radCache.set(el, rad);
            }
            this.radii[n] = rad * this.dpr;
            n++;
          }
          this.count = n;
        }
        bgPass(t) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, this.bg.fb);
          gl.useProgram(this.bgProg);
          gl.uniform2f(this.bgLoc.uRes, this.w, this.h);
          gl.uniform1f(this.bgLoc.uTime, t);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        blurPass(src, dst, dir) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
          gl.useProgram(this.blurProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, src.texture);
          gl.uniform1i(this.blurLoc.uTex, 0);
          gl.uniform2f(this.blurLoc.uTexel, 1 / this.w, 1 / this.h);
          gl.uniform2f(this.blurLoc.uDir, dir[0], dir[1]);
          gl.uniform1fv(this.blurLoc.uWeights, this.weights);
          gl.uniform1i(this.blurLoc.uRadius, this.radius);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        mainPass(t) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, this.w, this.h);
          gl.useProgram(this.mainProg);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.bg.texture);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, this.hb.texture);
          gl.uniform1i(this.mainLoc.uBg, 0);
          gl.uniform1i(this.mainLoc.uBlur, 1);
          gl.uniform2f(this.mainLoc.uRes, this.w, this.h);
          gl.uniform1f(this.mainLoc.uDpr, this.dpr);
          gl.uniform1f(this.mainLoc.uTime, t);
          gl.uniform1i(this.mainLoc.uShapeCount, this.count);
          gl.uniform4fv(this.mainLoc.uRects, this.rects);
          gl.uniform1fv(this.mainLoc.uRadii, this.radii);
          gl.uniform1f(this.mainLoc.uThickness, PROFILE.refThickness * this.dpr);
          gl.uniform1f(this.mainLoc.uRefFactor, PROFILE.refFactor);
          gl.uniform1f(this.mainLoc.uDispersion, PROFILE.refDispersion * this.dpr);
          gl.uniform1f(this.mainLoc.uFresnelRange, PROFILE.refFresnelRange * this.dpr);
          gl.uniform1f(this.mainLoc.uFresnelHardness, PROFILE.refFresnelHardness);
          gl.uniform1f(this.mainLoc.uFresnelFactor, PROFILE.refFresnelFactor);
          gl.uniform1f(this.mainLoc.uGlareRange, PROFILE.glareRange * this.dpr);
          gl.uniform1f(this.mainLoc.uGlareHardness, PROFILE.glareHardness);
          gl.uniform1f(this.mainLoc.uGlareFactor, PROFILE.glareFactor);
          gl.uniform1f(this.mainLoc.uGlareConvergence, PROFILE.glareConvergence);
          gl.uniform1f(this.mainLoc.uGlareOppositeFactor, PROFILE.glareOppositeFactor);
          gl.uniform1f(this.mainLoc.uGlareAngle, PROFILE.glareAngle);
          gl.uniform4f(this.mainLoc.uTint, PROFILE.tint.r / 255, PROFILE.tint.g / 255, PROFILE.tint.b / 255, PROFILE.tint.a);
          gl.uniform1i(this.mainLoc.uStep, PROFILE.step | 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        frame(t) {
          if (t - (this._lastCollect || 0) >= 200) {
            this.collect();
            this._lastCollect = t;
          }
          this.bgPass(t * 0.001);
          this.blurPass(this.bg, this.vb, [0, 1]);
          this.blurPass(this.vb, this.hb, [1, 0]);
          this.mainPass(t * 0.001);
        }
      }
      const r = new MultiPassRenderer();
      let id = 0;
      const loop = t => {
        r.frame(t);
        id = requestAnimationFrame(loop);
      };
      addEventListener('resize', () => r.resize(), {
        passive: true
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && id) {
          cancelAnimationFrame(id);
          id = 0;
        } else if (!document.hidden && !id) id = requestAnimationFrame(loop);
      });
      id = requestAnimationFrame(loop);
    })();
  </script>
</body>
